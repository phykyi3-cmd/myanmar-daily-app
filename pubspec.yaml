name: myanmar_daily_app
description: Offline-first modular Flutter daily utility app for Myanmar with zero cloud storage required.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.6.2
  provider: ^6.1.2
  sqflite: ^2.4.1
  path: ^1.9.0
  shared_preferences: ^2.3.3
  qr_flutter: ^4.1.0
  http: ^1.6.0
  myanmar_calendar_dart: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/recipes_mm.json
    - assets/images/dishes/
    - assets/images/baydin/

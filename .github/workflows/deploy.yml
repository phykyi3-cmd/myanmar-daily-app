name: Build & Deploy Myanmar Daily App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "deploy-myanmar-daily-app"
  cancel-in-progress: false

jobs:
  verify_and_deploy_pwa:
    name: Test & Deploy Installable Web PWA
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis & unit/widget tests
        run: |
          flutter analyze
          flutter test

      - name: Build release installable PWA for GitHub Pages
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          flutter build web --release --no-tree-shake-icons --base-href="/myanmar-daily-app/"
          sed -i 's|"main.dart.js"|"main.dart.js?v='"${SHORT_SHA}"'"|g' build/web/flutter_bootstrap.js
          sed -i 's|src="flutter_bootstrap.js"|src="flutter_bootstrap.js?v='"${SHORT_SHA}"'"|g' build/web/index.html
          cp build/web/index.html build/web/404.html
          cp build/web/favicon.png build/web/favicon.ico || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build_android_apk:
    name: Build & Publish Android Release APK
    runs-on: ubuntu-latest
    needs: verify_and_deploy_pwa
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'
          cache: true

      - name: Set up Gradle for wrapper generation
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Install Flutter packages & configure Maven mirror
        run: |
          flutter pub get
          mkdir -p ~/.gradle/init.d
          cat << 'EOF' > ~/.gradle/init.d/mirror.gradle
          def rewriteRepo = { repo ->
            if (repo instanceof MavenArtifactRepository) {
              def url = repo.url.toString()
              if (url.startsWith('https://repo.maven.apache.org/maven2')) {
                repo.url = uri('https://maven-central.storage-download.googleapis.com/maven2/')
              }
            }
          }
          beforeSettings { settings ->
            settings.pluginManagement.repositories.all rewriteRepo
            settings.dependencyResolutionManagement.repositories.all rewriteRepo
          }
          allprojects {
            repositories.all rewriteRepo
            buildscript.repositories.all rewriteRepo
          }
          EOF
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          if [ ! -f android/gradlew ]; then
            (cd android && gradle wrapper --gradle-version 9.5.0) || (sleep 15 && cd android && gradle wrapper --gradle-version 9.5.0)
          fi
          chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          flutter build apk --release --no-tree-shake-icons || (sleep 10 && flutter build apk --release --no-tree-shake-icons)
          cp build/app/outputs/flutter-apk/app-release.apk build/myanmar-daily-app-universal.apk

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: myanmar-daily-app-apk
          path: build/myanmar-daily-app-universal.apk

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-latest
          name: Myanmar Daily App (Latest Android APK)
          prerelease: false
          make_latest: true
          body: |
            မြန်မာနေ့စဉ် (Myanmar Daily App) Offline-First + 6-Country Regional Recipe Cost Calculator Android Release APK ဖြစ်ပါသည်။
            - Installable Web PWA: https://smartmyanmarfonts.com/myanmar-daily-app/
          files: build/myanmar-daily-app-universal.apk

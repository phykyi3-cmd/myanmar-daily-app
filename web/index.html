<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="မြန်မာနေ့စဉ်သုံး 6-in-1 Offline-First & Cloud-Synced App">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0D0D0D">

  <!-- iOS / Android PWA meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="မြန်မာနေ့စဉ်">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>မြန်မာနေ့စဉ်</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      background-color: #0D0D0D;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    }
    #loading-indicator {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0D0D0D;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #232F10;
      border-top-color: #B5F12E;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .title {
      font-size: 20px;
      font-weight: 800;
      color: #B5F12E;
      margin-bottom: 6px;
    }
    .sub {
      font-size: 13px;
      color: #B4B4B4;
    }
  </style>
</head>
<body>
  <div id="loading-indicator">
    <div class="spinner"></div>
    <div class="title">မြန်မာနေ့စဉ်</div>
    <div class="sub">App စတင်ဖွင့်နေပါသည်... ခေတ္တစောင့်ပါ</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading-indicator');
      if (el) el.remove();
    });
    setTimeout(function () {
      var el = document.getElementById('loading-indicator');
      if (el && document.querySelector('flt-glass-pane, flutter-view')) el.remove();
    }, 6000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
